[workspace]
resolver = "2"
members = ["crates/sim-core", "crates/homo-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

# Le noyau de calcul doit rester rapide même en debug (tests, développement).
[profile.dev.package.sim-core]
opt-level = 3

# Bevy est très lent en debug : on optimise les dépendances.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
