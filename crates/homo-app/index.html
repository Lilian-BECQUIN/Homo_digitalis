<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>Homo Digitalis — Simulateur Physiologique 3D</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="homo-digitalis" />
    <link data-trunk rel="copy-dir" href="assets"/>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05080f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #d1d5db;
        }
        #bevy_canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .spinner {
            width: 56px;
            height: 56px;
            border: 3px solid rgba(59, 130, 246, 0.15);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            margin: 0 auto 24px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: 0.12em;
            color: #f3f4f6;
            text-transform: uppercase;
        }
        p {
            font-size: 0.92rem;
            color: #9ca3af;
            margin: 0;
            letter-spacing: 0.02em;
        }
        .tagline {
            display: inline-block;
            margin-top: 14px;
            padding: 4px 12px;
            font-size: 0.78rem;
            color: #60a5fa;
            background: rgba(37, 99, 235, 0.12);
            border-radius: 9999px;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h1>Homo Digitalis</h1>
        <p>Initialisation du moteur multi-physique & rendu 3D...</p>
        <span class="tagline">WebAssembly &bull; WebGL2 / WebGPU</span>
    </div>
    <canvas id="bevy_canvas"></canvas>
    <script>
        // Masque automatiquement l'écran de chargement dès le premier rendu
        const hideLoading = () => {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.style.opacity = '0';
                setTimeout(() => loading.remove(), 700);
            }
        };

        // Détection de l'activité du canvas
        const canvas = document.getElementById('bevy_canvas');
        if (canvas) {
            canvas.addEventListener('webglcontextrestored', hideLoading, { once: true });
        }
        // Fallback temporisé au cas où aucun événement direct n'est levé
        window.addEventListener('load', () => {
            setTimeout(hideLoading, 2500);
        });
    </script>
</body>
</html>
